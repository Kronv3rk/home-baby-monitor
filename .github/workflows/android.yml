name: Android CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'licenses/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Tests, lint, release package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check offline legal texts
        run: |
          cmp PRIVACY.md app/src/main/assets/legal/PRIVACY.md
          cmp SAFETY_AND_TERMS.md app/src/main/assets/legal/SAFETY_AND_TERMS.md
          cmp THIRD_PARTY_NOTICES.md app/src/main/assets/legal/THIRD_PARTY_NOTICES.md
      - name: Security protocol and socket integration tests
        run: |
          bash tools/verify-jvm.sh
          bash tools/test-jni-init.sh
      - name: Test and compile release
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Verify WebRTC JNI registration classes in release APK
        run: bash tools/check-webrtc-r8.sh app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Stage unsigned release and signing tools
        run: |
          set -euo pipefail
          mkdir -p distribution
          cp app/build/outputs/apk/release/app-release-unsigned.apk distribution/HomeBabyMonitor-v0.5.1-unsigned.apk
          sha256sum distribution/HomeBabyMonitor-v0.5.1-unsigned.apk > distribution/SHA256SUMS.txt
          # Only used to sign the release offline; no private signing material is present in CI.
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" distribution/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" distribution/zipalign
          chmod +x distribution/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: HomeBabyMonitor-v0.5.1-unsigned-release
          path: distribution/*
          if-no-files-found: error
          retention-days: 14
