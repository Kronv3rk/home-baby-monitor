name: Сообщение об ошибке
description: Ошибка приложения без персональных данных
title: "[Ошибка] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Не прикладывайте фото/видео ребёнка, коды сопряжения, пароли и домашние IP-адреса. О проблемах безопасности сообщайте по SECURITY.md."
  - type: input
    id: android
    attributes:
      label: Модель телефона и версия Android
      placeholder: "Например, Samsung Galaxy ..., Android ..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый и фактический результат
    validations:
      required: true
